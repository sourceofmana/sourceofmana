name: "release"

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  builds:
    uses: ./.github/workflows/export.yml
    with:
      features: production,sentry
    secrets: inherit

  snap:
    needs: builds
    uses: ./.github/workflows/snap.yml
    with:
      channel: candidate
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: builds
    name: Tag and Release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Read version from project.godot
        id: ver
        run: echo "version=$(grep -oP 'config/version=\"\K[^\"]+' project.godot)" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "v${{ steps.ver.outputs.version }}"; then
            echo "Tag v${{ steps.ver.outputs.version }} already exists - bump config/version in project.godot first." && exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Package release assets
        uses: ./.github/actions/package-builds
        with:
          source-dir: dist
          output-dir: assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          target_commitish: ${{ github.sha }}
          name: "Source of Mana v${{ steps.ver.outputs.version }}"
          prerelease: ${{ inputs.prerelease }}
          draft: true
          files: assets/*
