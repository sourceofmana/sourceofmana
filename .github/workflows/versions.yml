name: "versions"

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
    outputs:
      godot:
        value: ${{ jobs.read.outputs.godot }}

jobs:
  read:
    runs-on: ubuntu-latest
    name: Read versions.cfg
    outputs:
      godot: ${{ steps.read.outputs.godot }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: versions.cfg
          sparse-checkout-cone-mode: false

      - name: Read versions.cfg
        id: read
        run: |
          . ./versions.cfg
          echo "godot=${GODOT}" >> "$GITHUB_OUTPUT"
